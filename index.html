<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate – CS Study Companion</title>
  <meta name="description" content="StudyMate is a student-built study assistant for computer science topics like Python, DBMS, HTML, CSS, Git, and safe math calculations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">
  <div class="chat-app">
    <!-- Top App Navigation -->
    <header class="app-header">
      <div class="header-left">
        <div class="avatar-container">
          <div class="tutor-avatar">SM</div>
          <span class="online-dot" title="Active"></span>
        </div>
        <div class="tutor-info">
          <div class="tutor-title-row">
            <h1 class="tutor-name">StudyMate</h1>
            <span class="student-badge">Study Companion</span>
          </div>
          <p class="tutor-status">Online and ready to assist</p>
        </div>
      </div>

      <div class="header-right">
        <button id="quickHelpBtn" class="nav-btn" title="View Topics">
          <span>Topics</span>
        </button>
        <button id="clearChatBtn" class="nav-btn" title="Clear Chat">
          <span>Reset</span>
        </button>
        <button id="themeToggleBtn" class="nav-btn icon-only" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <span id="themeIcon">Theme</span>
        </button>
      </div>
    </header>

    <!-- Chat Messages Window -->
    <main class="chat-window" id="chatWindow">
      <!-- Date Divider -->
      <div class="date-divider">
        <span>Today</span>
      </div>

      <!-- Humanized Welcome Card (No Emojis) -->
      <div class="welcome-box" id="welcomeBox">
        <div class="welcome-header">
          <div>
            <h2 class="welcome-greeting">Welcome to StudyMate</h2>
            <p class="welcome-subtext">
              A computer science study assistant built to help review fundamental topics in Python, DBMS, HTML, CSS, Git, system time, and quick arithmetic.
            </p>
          </div>
        </div>

        <div class="tags-section">
          <span class="tags-title">Suggested questions:</span>
          <div class="topic-tags">
            <button class="topic-tag" data-query="What is Python?">Python Basics</button>
            <button class="topic-tag" data-query="What is DBMS?">SQL & DBMS</button>
            <button class="topic-tag" data-query="What is HTML?">HTML Tags</button>
            <button class="topic-tag" data-query="Why use CSS?">Styling with CSS</button>
            <button class="topic-tag" data-query="What is GitHub?">Git & GitHub</button>
            <button class="topic-tag" data-query="calculate 45 * 12">Math (45 * 12)</button>
            <button class="topic-tag" data-query="What is today's date?">Today's Date</button>
            <button class="topic-tag" data-query="What is the time?">Current Time</button>
            <button class="topic-tag" data-query="help">Help & Examples</button>
          </div>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="messages-container" id="messagesContainer"></div>

      <!-- Typing Indicator -->
      <div class="typing-indicator-row" id="typingIndicator" style="display: none;">
        <div class="mini-bot-avatar">SM</div>
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </main>

    <!-- Bottom Message Bar -->
    <footer class="app-footer">
      <form id="chatForm" class="message-form">
        <div class="input-pill">
          <input 
            type="text" 
            id="userInput" 
            class="message-input" 
            placeholder="Ask about Python, DBMS, Git, math, or type 'help'..." 
            autocomplete="off" 
            required
          >
          <button type="submit" id="sendBtn" class="send-button" aria-label="Send Message">
            <span>Send</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </form>
      <div class="author-credit">
        Crafted by Preeti • CodeAlpha Internship
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
